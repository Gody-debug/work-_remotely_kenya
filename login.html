 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - WorkRemote</title>
</head>
<body style="font-family:Arial; background:#FAF8F3; display:flex; justify-content:center; padding:40px;">
<div style="background:white; max-width:380px; width:100%; padding:30px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,0.08);">
<h2>Welcome Back</h2>
<p style="color:#666; font-size:13px;">Login with your registered credentials</p>
<label>Phone Number</label>
<input id="phone" style="width:100%; padding:13px; border-radius:10px; border:1px solid #ccc; margin:8px 0 14px 0; box-sizing:border-box;">
<label>Password</label>
<input id="pass" type="password" style="width:100%; padding:13px; border-radius:10px; border:1px solid #ccc; margin:8px 0 14px 0; box-sizing:border-box;">
<button onclick="doLogin()" style="background:#5D4037; color:white; border:none; padding:14px; width:100%; border-radius:10px; font-weight:bold; cursor:pointer;">Login → Dashboard</button>
<p style="font-size:13px; text-align:center; margin-top:14px;"><a href="register.html" style="color:#5D4037;">No account? Register here</a></p>
<p id="err" style="color:red; font-size:13px;"></p>
</div>
<script>
function doLogin(){
 let phone=document.getElementById('phone').value.trim();
 let pass=document.getElementById('pass').value.trim();
 let saved=JSON.parse(localStorage.getItem('workremote_user')||'{}');
 // also check if activated
 let activated=localStorage.getItem('workremote_paid')==='yes';
 if(!saved.phone){ document.getElementById('err').innerText="No account found on this device. Please register first."; return; }
 if(saved.phone!==phone && '254'+phone.substring(1)!==saved.phone && phone!==saved.phone){ document.getElementById('err').innerText="Phone not matching registered phone: "+saved.phone; return; }
 if(saved.password!==pass){ document.getElementById('err').innerText="Wrong password. You set it during registration."; return; }
 if(!activated){ location.href='payment.html?phone='+phone; return; }
 location.href='dashboard.html';
}
</script>
</body>
</html>
